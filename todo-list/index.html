<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список справ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container todo-container">
        <div class="todo-card">
            <header class="todo-header">
                <h1>Список справ</h1>
                <p class="subtitle mb-0">Одна справа за одною.</p>
            </header>

            <form id="task-form">
                <label for="task-input" class="visually-hidden">Нове завдання</label>
                <div class="input-group mb-4">
                    <input type="text" id="task-input" class="form-control"
                        placeholder="Що потрібно зробити?" autocomplete="off" required>
                    <button type="submit" class="btn btn-primary">Додати</button>
                </div>
            </form>

            <fieldset>
                <legend>Мої завдання</legend>
                <p id="empty-message" class="empty-message">Тут поки порожньо. Додай першу справу.</p>
                <ul id="task-list" class="list-group"></ul>
            </fieldset>

            <p class="hint mb-0 mt-4">Натисни на завдання, щоб позначити його виконаним.</p>
        </div>
    </main>
</body>
</html>
